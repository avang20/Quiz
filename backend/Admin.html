<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>QuizDuo Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

body.dark {
    background: #111827;
    color: #f3f4f6;
}

header {
    padding: 22px 30px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.dark header {
    background: #1f2937;
    border-color: #374151;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 30px;
}

.panel {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.dark .panel {
    background: #1f2937;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
    margin-top: 8px;
    margin-bottom: 10px;
    background: white;
}

.dark input,
.dark textarea,
.dark select {
    background: #111827;
    color: white;
    border-color: #4b5563;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 11px 17px;
    cursor: pointer;
    font: inherit;
}

.primary {
    background: #16a6a1;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #dc2626;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.warning {
    background: #d97706;
    color: white;
}

.hidden {
    display: none !important;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab.active {
    background: #16a6a1;
    color: white;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(360px,1fr));
    gap: 18px;
}

.status {
    display: inline-block;
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 13px;
}

.status.pending {
    background: #fff3cd;
    color: #8a5a00;
}

.status.approved {
    background: #dcfce7;
    color: #166534;
}

.status.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.status.reply {
    background: #dbeafe;
    color: #1e40af;
}

.status.closed {
    background: #e5e7eb;
    color: #374151;
}

.meta {
    color: #6b7280;
    font-size: 13px;
    line-height: 1.9;
}

.dark .meta {
    color: #9ca3af;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.thread {
    margin-top: 15px;
    border-top: 1px solid #e5e7eb;
    padding-top: 15px;
}

.dark .thread {
    border-color: #374151;
}

.message {
    padding: 13px;
    border-radius: 13px;
    margin: 10px 0;
    line-height: 1.9;
}

.user-message {
    background: #eefcfb;
    border-right: 4px solid #16a6a1;
}

.admin-message {
    background: #eef2ff;
    border-right: 4px solid #6366f1;
}

.dark .user-message {
    background: #12302f;
}

.dark .admin-message {
    background: #25264a;
}

.message-author {
    font-weight: bold;
    margin-bottom: 5px;
}

.reply-box {
    margin-top: 15px;
}

.small {
    font-size: 13px;
}

.receipt {
    display: inline-block;
    margin-top: 10px;
    color: #0f766e;
    font-weight: bold;
}

.login {
    max-width: 420px;
    margin: 100px auto;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.top-actions {
    display: flex;
    gap: 10px;
}

</style>

</head>


<body>


<header>

    <h1>
        QuizDuo Admin
    </h1>

    <div class="top-actions">

        <button
            id="themeBtn"
            class="secondary"
        >
            🌙
        </button>

        <button
            id="logoutBtn"
            class="danger"
        >
            خروج
        </button>

    </div>

</header>


<div
    id="loginPanel"
    class="panel login"
>

    <h2>
        ورود مدیریت
    </h2>

    <input
        id="password"
        type="password"
        placeholder="رمز مدیریت"
    >

    <button
        id="loginBtn"
        class="primary"
        style="width:100%"
    >
        ورود
    </button>

    <p
        id="loginMessage"
        class="meta"
    ></p>

</div>


<main
    id="dashboard"
    class="container hidden"
>

    <div class="tabs">

        <button
            class="tab active primary"
            data-tab="payments"
        >
            💳 اشتراک‌ها
        </button>

        <button
            class="tab secondary"
            data-tab="support"
        >
            🎫 پشتیبانی
        </button>

    </div>


    <section
        id="paymentsTab"
    >

        <div class="panel">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
            ">

                <div>

                    <h2>
                        درخواست‌های اشتراک
                    </h2>

                    <p class="meta">
                        فیش‌ها را بررسی و وضعیت آن‌ها را تعیین کنید.
                    </p>

                </div>

                <button
                    id="refreshPayments"
                    class="secondary"
                >
                    به‌روزرسانی
                </button>

            </div>

        </div>


        <div
            id="payments"
            class="card-grid"
        ></div>

    </section>


    <section
        id="supportTab"
        class="hidden"
    >

        <div class="panel">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
            ">

                <div>

                    <h2>
                        گفت‌وگوهای پشتیبانی
                    </h2>

                    <p class="meta">
                        پیام کاربر، ادامه گفت‌وگو و پاسخ‌ها در همین بخش قرار دارند.
                    </p>

                </div>

                <button
                    id="refreshSupport"
                    class="secondary"
                >
                    به‌روزرسانی
                </button>

            </div>

        </div>


        <div
            id="support"
            class="card-grid"
        ></div>

    </section>

</main>


<script>


let ADMIN_PASSWORD = "";

let payments = [];

let support = [];


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


function formatDate(value) {

    if (!value) {
        return "";
    }

    try {

        return new Date(value)
            .toLocaleString("fa-IR");

    } catch {

        return String(value);
    }
}


function money(value) {

    return Number(value || 0)
        .toLocaleString("fa-IR") +
        " تومان";
}


function statusClass(status) {

    if (status === "تأیید شد") {
        return "approved";
    }

    if (status === "رد شد") {
        return "rejected";
    }

    if (status === "پاسخ داده شد") {
        return "reply";
    }

    if (status === "بسته شد") {
        return "closed";
    }

    return "pending";
}


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginBtn")
    .addEventListener(
        "click",
        login
    );


function login() {

    const password =
        document
            .getElementById("password")
            .value;


    if (!password) {

        document
            .getElementById(
                "loginMessage"
            )
            .textContent =
            "رمز مدیریت را وارد کنید.";

        return;
    }


    google.script.run

        .withSuccessHandler(
            result => {

                if (result) {

                    ADMIN_PASSWORD =
                        password;

                    document
                        .getElementById(
                            "loginPanel"
                        )
                        .classList
                        .add("hidden");


                    document
                        .getElementById(
                            "dashboard"
                        )
                        .classList
                        .remove("hidden");


                    loadAll();

                } else {

                    document
                        .getElementById(
                            "loginMessage"
                        )
                        .textContent =
                        "رمز مدیریت اشتباه است.";
                }
            }
        )

        .withFailureHandler(
            error => {

                document
                    .getElementById(
                        "loginMessage"
                    )
                    .textContent =
                    error.message ||
                    "خطا در ورود.";
            }
        )

        .checkAdmin(password);
}


/* =========================================================
   LOAD
========================================================= */

function loadAll() {

    loadPayments();

    loadSupport();
}


function loadPayments() {

    google.script.run

        .withSuccessHandler(
            data => {

                payments =
                    Array.isArray(data)
                        ? data
                        : [];

                renderPayments();
            }
        )

        .withFailureHandler(
            showError
        )

        .getPaymentsForAdmin(
            ADMIN_PASSWORD
        );
}


function loadSupport() {

    google.script.run

        .withSuccessHandler(
            data => {

                support =
                    Array.isArray(data)
                        ? data
                        : [];

                renderSupport();
            }
        )

        .withFailureHandler(
            showError
        )

        .getSupportForAdmin(
            ADMIN_PASSWORD
        );
}


function showError(error) {

    alert(
        error.message ||
        "خطایی رخ داد."
    );
}


/* =========================================================
   PAYMENTS
========================================================= */

function renderPayments() {

    const box =
        document.getElementById(
            "payments"
        );


    if (!payments.length) {

        box.innerHTML =
            `<div class="panel empty">
                هنوز فیشی ثبت نشده است.
             </div>`;

        return;
    }


    box.innerHTML =
        payments.map(
            item => `

                <article class="panel">

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        gap:10px;
                    ">

                        <div>

                            <h3>
                                ${escapeHtml(
                                    item.planName ||
                                    item.planId
                                )}
                            </h3>

                            <p class="meta">

                                کاربر:
                                ${escapeHtml(
                                    item.username
                                )}

                                <br>

                                تلفن:
                                ${escapeHtml(
                                    item.phone
                                )}

                            </p>

                        </div>


                        <span
                            class="status ${
                                statusClass(
                                    item.status
                                )
                            }"
                        >
                            ${escapeHtml(
                                item.status
                            )}
                        </span>

                    </div>


                    <div class="meta">

                        💰 مبلغ:
                        <b>
                            ${money(
                                item.amount
                            )}
                        </b>

                        <br>

                        🕒 زمان:
                        ${escapeHtml(
                            formatDate(
                                item.timestamp
                            )
                        )}

                        ${
                            item.discountCode
                                ? `
                                    <br>
                                    کد تخفیف:
                                    ${escapeHtml(
                                        item.discountCode
                                    )}
                                  `
                                : ""
                        }

                    </div>


                    ${
                        item.receiptUrl
                            ? `
                                <a
                                    class="receipt"
                                    href="${item.receiptUrl}"
                                    target="_blank"
                                >
                                    📷 مشاهده فیش
                                </a>
                              `
                            : ""
                    }


                    ${
                        item.userMessage
                            ? `
                                <div class="message admin-message">
                                    <b>
                                        پیام ثبت‌شده برای کاربر:
                                    </b>

                                    <br>

                                    ${escapeHtml(
                                        item.userMessage
                                    )}
                                </div>
                              `
                            : ""
                    }


                    <div class="actions">

                        <button
                            class="success"
                            onclick="changePaymentStatus(
                                ${item.rowNumber},
                                'تأیید شد'
                            )"
                        >
                            ✓ تأیید
                        </button>


                        <button
                            class="danger"
                            onclick="changePaymentStatus(
                                ${item.rowNumber},
                                'رد شد'
                            )"
                        >
                            ✕ رد
                        </button>


                        <button
                            class="secondary"
                            onclick="changePaymentStatus(
                                ${item.rowNumber},
                                'در انتظار بررسی'
                            )"
                        >
                            در حال بررسی
                        </button>

                    </div>

                </article>
            `
        ).join("");
}


function changePaymentStatus(
    row,
    status
) {

    google.script.run

        .withSuccessHandler(
            () => {

                loadPayments();
            }
        )

        .withFailureHandler(
            showError
        )

        .updatePaymentStatus(
            ADMIN_PASSWORD,
            row,
            status
        );
}


/* =========================================================
   SUPPORT
========================================================= */

function renderSupport() {

    const box =
        document.getElementById(
            "support"
        );


    if (!support.length) {

        box.innerHTML =
            `<div class="panel empty">
                هنوز پیام پشتیبانی ثبت نشده است.
             </div>`;

        return;
    }


    box.innerHTML =
        support.map(
            item => {

                const thread =
                    Array.isArray(
                        item.thread
                    )
                        ? item.thread
                        : [];


                const threadHtml =
                    thread.map(
                        message => `

                            <div
                                class="message ${
                                    message.sender ===
                                    "admin"
                                        ? "admin-message"
                                        : "user-message"
                                }"
                            >

                                <div class="message-author">

                                    ${
                                        message.sender ===
                                        "admin"
                                            ? "پشتیبانی"
                                            : "کاربر"
                                    }

                                </div>


                                <div>

                                    ${escapeHtml(
                                        message.text
                                    )}

                                </div>


                                <small class="meta">

                                    ${escapeHtml(
                                        formatDate(
                                            message.timestamp
                                        )
                                    )}

                                </small>

                            </div>
                        `
                    ).join("");


                const closed =
                    item.status ===
                    "بسته شد";


                return `

                    <article
                        class="panel"
                    >

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            gap:10px;
                        ">

                            <div>

                                <span class="meta">
                                    کاربر
                                </span>

                                <h3>
                                    ${escapeHtml(
                                        item.username
                                    )}
                                </h3>

                                <p class="meta">

                                    موضوع:
                                    ${escapeHtml(
                                        item.subject
                                    )}

                                    <br>

                                    تلفن:
                                    ${escapeHtml(
                                        item.phone
                                    )}

                                </p>

                            </div>


                            <span
                                class="status ${
                                    statusClass(
                                        item.status
                                    )
                                }"
                            >
                                ${escapeHtml(
                                    item.status
                                )}
                            </span>

                        </div>


                        <div class="thread">

                            ${
                                threadHtml ||
                                `
                                    <div class="message user-message">

                                        ${escapeHtml(
                                            item.message
                                        )}

                                    </div>
                                `
                            }

                        </div>


                        ${
                            closed

                                ? `
                                    <div class="message">

                                        کاربر این گفت‌وگو را به پایان رسانده است.

                                    </div>
                                  `

                                : `

                                    <div class="reply-box">

                                        <label>
                                            پاسخ به کاربر
                                        </label>

                                        <textarea
                                            id="reply-${item.rowNumber}"
                                            placeholder="پاسخ خود را در همین گفت‌وگو بنویسید..."
                                        ></textarea>


                                        <div class="actions">

                                            <button
                                                class="primary"
                                                onclick="replySupport(
                                                    ${item.rowNumber}
                                                )"
                                            >
                                                ارسال پاسخ
                                            </button>


                                            <button
                                                class="secondary"
                                                onclick="setSupportStatus(
                                                    ${item.rowNumber},
                                                    'در حال بررسی'
                                                )"
                                            >
                                                در حال بررسی
                                            </button>


                                            <button
                                                class="secondary"
                                                onclick="setSupportStatus(
                                                    ${item.rowNumber},
                                                    'پاسخ داده شد'
                                                )"
                                            >
                                                پاسخ داده شد
                                            </button>

                                        </div>

                                    </div>
                                  `
                        }

                    </article>
                `;
            }
        ).join("");
}


function replySupport(row) {

    const textarea =
        document.getElementById(
            "reply-" + row
        );


    if (!textarea) {
        return;
    }


    const text =
        textarea.value.trim();


    if (!text) {

        alert(
            "متن پاسخ را وارد کنید."
        );

        return;
    }


    google.script.run

        .withSuccessHandler(
            () => {

                loadSupport();
            }
        )

        .withFailureHandler(
            showError
        )

        .replyToSupport(
            ADMIN_PASSWORD,
            row,
            text,
            "پاسخ داده شد"
        );
}


function setSupportStatus(
    row,
    status
) {

    google.script.run

        .withSuccessHandler(
            () =>
                loadSupport()
        )

        .withFailureHandler(
            showError
        )

        .updateSupportStatus(
            ADMIN_PASSWORD,
            row,
            status
        );
}


/* =========================================================
   TABS
========================================================= */

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            b =>
                                b.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList
                        .add("active");


                    const tab =
                        button.dataset.tab;


                    document
                        .getElementById(
                            "paymentsTab"
                        )
                        .classList
                        .toggle(
                            "hidden",
                            tab !==
                            "payments"
                        );


                    document
                        .getElementById(
                            "supportTab"
                        )
                        .classList
                        .toggle(
                            "hidden",
                            tab !==
                            "support"
                        );
                }
            );
        }
    );


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById(
        "refreshPayments"
    )
    .addEventListener(
        "click",
        loadPayments
    );


document
    .getElementById(
        "refreshSupport"
    )
    .addEventListener(
        "click",
        loadSupport
    );


/* =========================================================
   THEME
========================================================= */

document
    .getElementById(
        "themeBtn"
    )
    .addEventListener(
        "click",
        () => {

            document.body
                .classList
                .toggle("dark");
        }
    );


/* =========================================================
   LOGOUT
========================================================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        () => {

            ADMIN_PASSWORD = "";

            document
                .getElementById(
                    "dashboard"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "loginPanel"
                )
                .classList
                .remove("hidden");


            document
                .getElementById(
                    "password"
                )
                .value = "";
        }
    );

</script>

</body>

</html>
