<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>QuizDuo Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#f4f8f8;

    color:#16252b;
}

.wrap{
    max-width:1200px;

    margin:40px auto;

    padding:0 20px;
}

.panel{

    background:#fff;

    border:
        1px solid #dbe7e8;

    border-radius:18px;

    padding:22px;

    margin-bottom:20px;

    box-shadow:
        0 10px 30px
        rgba(20,50,55,.07);
}

h1,
h2{
    margin-top:0;
}

input,
button,
select,
textarea{

    font:inherit;
}

input{

    width:100%;

    padding:12px;

    border:
        1px solid #cbdcde;

    border-radius:10px;

    margin:8px 0;
}

button{

    border:0;

    border-radius:10px;

    padding:10px 14px;

    cursor:pointer;
}

.primary{

    background:#13a6a6;

    color:#fff;
}

.secondary{

    background:#e8f4f4;

    color:#176b70;
}

.danger{

    background:#ffe8e8;

    color:#a32626;
}

.status{

    padding:6px 9px;

    border-radius:999px;

    background:#eef4f4;

    display:inline-block;
}

.hidden{

    display:none;
}

.table-wrap{

    overflow:auto;
}

table{

    width:100%;

    border-collapse:collapse;

    min-width:900px;
}

th,
td{

    padding:12px;

    border-bottom:
        1px solid #e4eeee;

    text-align:right;

    vertical-align:top;
}

th{

    background:#f5fafa;
}

.actions{

    display:flex;

    gap:6px;

    flex-wrap:wrap;
}

.muted{

    color:#6d7e82;
}

.receipt{

    display:inline-block;

    margin-top:6px;
}

body.dark{

    background:#10171d;

    color:#edf7f7;
}

body.dark .panel{

    background:#182229;

    border-color:#2b3b43;
}

body.dark input,
body.dark select,
body.dark textarea{

    background:#10171d;

    color:#edf7f7;

    border-color:#3a4b55;
}

body.dark th{

    background:#20323a;
}

body.dark td{

    border-color:#2b3b43;
}

</style>

</head>


<body>

<div class="wrap">


<div class="panel">

<h1>
    QuizDuo Admin
</h1>

<p class="muted">
    مدیریت فیش‌های پرداخت و پیام‌های پشتیبانی
</p>


<input
    id="password"
    type="password"
    placeholder="رمز مدیریت"
>


<div class="actions">

<button
    class="primary"
    onclick="login()"
>
    ورود به مدیریت
</button>


<button
    class="secondary"
    onclick="toggleTheme()"
>
    روشن / تاریک
</button>

</div>


<p id="loginMsg"></p>

</div>


<div
    id="dashboard"
    class="hidden"
>


<div class="panel">

<div class="actions">

<button
    class="primary"
    onclick="loadAll()"
>
    به‌روزرسانی
</button>


<button
    class="danger"
    onclick="logout()"
>
    خروج
</button>

</div>

</div>


<div class="panel">

<h2>
    💳 پرداخت‌ها
</h2>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    زمان
</th>

<th>
    کاربر
</th>

<th>
    تماس
</th>

<th>
    پلن
</th>

<th>
    مبلغ
</th>

<th>
    فیش
</th>

<th>
    وضعیت
</th>

<th>
    عملیات
</th>

</tr>

</thead>


<tbody
    id="paymentsBody"
></tbody>

</table>

</div>

</div>


<div class="panel">

<h2>
    🎫 پشتیبانی
</h2>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    زمان
</th>

<th>
    کاربر
</th>

<th>
    تماس
</th>

<th>
    موضوع
</th>

<th>
    پیام
</th>

<th>
    وضعیت
</th>

<th>
    عملیات
</th>

</tr>

</thead>


<tbody
    id="supportBody"
></tbody>

</table>

</div>

</div>


</div>

</div>


<script>

let adminPassword = "";


function login(){

    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const msg =
        document.getElementById(
            "loginMsg"
        );


    if(!password){

        msg.textContent =
            "رمز مدیریت را وارد کنید.";

        return;
    }


    adminPassword =
        password;


    google.script.run

        .withSuccessHandler(
            () => {

                msg.textContent =
                    "ورود موفق بود.";

                document
                    .getElementById(
                        "dashboard"
                    )
                    .classList
                    .remove("hidden");

                loadAll();
            }
        )

        .withFailureHandler(
            error => {

                adminPassword =
                    "";

                msg.textContent =
                    error.message ||
                    "رمز مدیریت اشتباه است.";
            }
        )

        .getPaymentsForAdmin(
            password
        );
}


function logout(){

    adminPassword =
        "";

    document
        .getElementById(
            "dashboard"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "password"
        )
        .value = "";


    document
        .getElementById(
            "loginMsg"
        )
        .textContent = "";
}


function loadAll(){

    loadPayments();

    loadSupport();
}


function loadPayments(){

    google.script.run

        .withSuccessHandler(
            renderPayments
        )

        .withFailureHandler(
            error => {

                document
                    .getElementById(
                        "paymentsBody"
                    )
                    .innerHTML =
                    `<tr>
                        <td colspan="8">
                            ${escapeHtml(
                                error.message ||
                                "خطا"
                            )}
                        </td>
                    </tr>`;
            }
        )

        .getPaymentsForAdmin(
            adminPassword
        );
}


function loadSupport(){

    google.script.run

        .withSuccessHandler(
            renderSupport
        )

        .withFailureHandler(
            error => {

                document
                    .getElementById(
                        "supportBody"
                    )
                    .innerHTML =
                    `<tr>
                        <td colspan="7">
                            ${escapeHtml(
                                error.message ||
                                "خطا"
                            )}
                        </td>
                    </tr>`;
            }
        )

        .getSupportForAdmin(
            adminPassword
        );
}


function renderPayments(rows){

    const body =
        document.getElementById(
            "paymentsBody"
        );


    if(!rows.length){

        body.innerHTML =
            `<tr>
                <td colspan="8">
                    هنوز پرداختی ثبت نشده است.
                </td>
            </tr>`;

        return;
    }


    body.innerHTML =
        rows
            .map(
                row => `

<tr>

<td>
    ${formatDate(
        row.timestamp
    )}
</td>

<td>
    ${escapeHtml(
        row.username
    )}
</td>

<td>
    ${escapeHtml(
        row.phone || "-"
    )}
</td>

<td>
    ${escapeHtml(
        row.planName ||
        row.planId
    )}
</td>

<td>
    ${Number(
        row.amount || 0
    ).toLocaleString(
        "fa-IR"
    )}
    تومان
</td>

<td>

${
    row.receiptUrl

        ? `<a
            class="receipt"
            href="${escapeAttribute(
                row.receiptUrl
            )}"
            target="_blank"
        >
            مشاهده فیش
        </a>`

        : "-"
}

</td>

<td>

<span class="status">

${escapeHtml(
    row.status || "-"
)}

</span>

</td>

<td>

<div class="actions">

<button
    class="primary"
    onclick="setPaymentStatus(
        ${row.rowNumber},
        'تأیید شد'
    )"
>
    تأیید
</button>


<button
    class="danger"
    onclick="setPaymentStatus(
        ${row.rowNumber},
        'رد شد'
    )"
>
    رد
</button>


<button
    class="secondary"
    onclick="setPaymentStatus(
        ${row.rowNumber},
        'در انتظار بررسی'
    )"
>
    انتظار
</button>

</div>

</td>

</tr>

`
            )
            .join("");
}


function renderSupport(rows){

    const body =
        document.getElementById(
            "supportBody"
        );


    if(!rows.length){

        body.innerHTML =
            `<tr>
                <td colspan="7">
                    هنوز پیام پشتیبانی ثبت نشده است.
                </td>
            </tr>`;

        return;
    }


    body.innerHTML =
        rows
            .map(
                row => `

<tr>

<td>
    ${formatDate(
        row.timestamp
    )}
</td>

<td>
    ${escapeHtml(
        row.username
    )}
</td>

<td>
    ${escapeHtml(
        row.phone || "-"
    )}
</td>

<td>
    ${escapeHtml(
        row.subject
    )}
</td>

<td>
    ${escapeHtml(
        row.message
    ).replace(
        /\n/g,
        "<br>"
    )}
</td>

<td>

<span class="status">

${escapeHtml(
    row.status || "-"
)}

</span>

</td>

<td>

<div class="actions">

<button
    class="primary"
    onclick="setSupportStatus(
        ${row.rowNumber},
        'پاسخ داده شد'
    )"
>
    پاسخ داده شد
</button>


<button
    class="secondary"
    onclick="setSupportStatus(
        ${row.rowNumber},
        'در حال بررسی'
    )"
>
    در حال بررسی
</button>


<button
    class="danger"
    onclick="setSupportStatus(
        ${row.rowNumber},
        'بسته شد'
    )"
>
    بسته
</button>

</div>

</td>

</tr>

`
            )
            .join("");
}


function setPaymentStatus(
    rowNumber,
    status
){

    google.script.run

        .withSuccessHandler(
            loadPayments
        )

        .withFailureHandler(
            error =>
                alert(
                    error.message ||
                    "خطا"
                )
        )

        .updatePaymentStatus(
            adminPassword,
            rowNumber,
            status
        );
}


function setSupportStatus(
    rowNumber,
    status
){

    google.script.run

        .withSuccessHandler(
            loadSupport
        )

        .withFailureHandler(
            error =>
                alert(
                    error.message ||
                    "خطا"
                )
        )

        .updateSupportStatus(
            adminPassword,
            rowNumber,
            status
        );
}


function toggleTheme(){

    document.body
        .classList
        .toggle("dark");
}


function formatDate(value){

    if(!value){
        return "-";
    }


    try{

        return new Date(
            value
        ).toLocaleString(
            "fa-IR"
        );

    }catch{

        return value;
    }
}


function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );
}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );
}

</script>

</body>

</html>
