<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>QuizDuo Admin</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f8f8;
  color:#16252b;
  line-height:1.8
}

.wrap{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px
}

.panel{
  background:#fff;
  border:1px solid #dbe7e8;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(20,50,55,.07)
}

input,
select,
textarea,
button{
  font:inherit
}

input,
select,
textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid #cbdcde;
  border-radius:10px;
  margin:6px 0;
  background:#fff;
  color:#16252b
}

textarea{
  min-height:90px;
  resize:vertical
}

button{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  cursor:pointer
}

.primary{
  background:#13a6a6;
  color:#fff
}

.secondary{
  background:#e8f4f4;
  color:#176b70
}

.danger{
  background:#ffe8e8;
  color:#a32626
}

.hidden{
  display:none!important
}

.muted{
  color:#6d7e82
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  background:#eef4f4;
  font-size:.85rem
}

.status.approved{
  background:#ddfaef;
  color:#087b59
}

.status.rejected{
  background:#ffe7e7;
  color:#a32626
}

.status.pending{
  background:#fff5d9;
  color:#8a6200
}

.status.replied{
  background:#ddf7f7;
  color:#087274
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(320px,1fr)
    );
  gap:15px
}

.item-card{
  border:1px solid #dfeaea;
  border-radius:16px;
  padding:16px;
  background:#fbfdfd
}

.item-card.new{
  border-color:#76d9c1;
  box-shadow:
    0 0 0 3px #eafff5
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.item-head h3{
  margin:2px 0
}

.meta{
  display:grid;
  gap:5px;
  color:#607276;
  font-size:.9rem;
  margin:10px 0
}

.message-box{
  background:#f4f8f8;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  white-space:pre-wrap
}

.reply-box{
  margin-top:12px
}

.reply-meta{
  font-size:.78rem;
  color:#6d7e82;
  margin-top:5px
}

.receipt{
  display:inline-block;
  margin-top:8px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.refresh-status{
  font-size:.9rem;
  color:#6d7e82;
  margin-top:8px
}

.empty{
  padding:18px;
  text-align:center;
  color:#6d7e82;
  background:#f7fafb;
  border-radius:12px
}

.top-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

body.dark{
  background:#10171d;
  color:#edf7f7
}

body.dark .panel,
body.dark .item-card{
  background:#182229;
  border-color:#2b3b43
}

body.dark input,
body.dark select,
body.dark textarea{
  background:#10171d;
  color:#edf7f7;
  border-color:#3a4b55
}

body.dark .message-box,
body.dark .empty{
  background:#20323a
}

body.dark .muted,
body.dark .meta,
body.dark .reply-meta{
  color:#9eb0b8
}

@media(max-width:650px){

  .cards{
    grid-template-columns:1fr
  }

  .item-head{
    flex-direction:column
  }

  .wrap{
    margin-top:15px
  }

}

</style>

</head>

<body>

<div class="wrap">

  <div class="panel">

    <h1>
      QuizDuo Admin
    </h1>

    <p class="muted">
      مدیریت اشتراک‌ها و پیام‌های کاربران
    </p>

    <input
      id="password"
      type="password"
      placeholder="رمز مدیریت"
    >

    <div class="actions">

      <button
        class="primary"
        onclick="login()"
      >
        ورود به مدیریت
      </button>

      <button
        class="secondary"
        onclick="toggleTheme()"
      >
        روشن / تاریک
      </button>

    </div>

    <p id="loginMsg"></p>

  </div>


  <div
    id="dashboard"
    class="hidden"
  >

    <div class="panel">

      <div class="top-actions">

        <div class="actions">

          <button
            class="primary"
            onclick="loadAll()"
          >
            🔄 به‌روزرسانی
          </button>

          <button
            class="danger"
            onclick="logout()"
          >
            خروج
          </button>

        </div>

        <div
          id="refreshStatus"
          class="refresh-status"
        >
          آماده
        </div>

      </div>

    </div>


    <div class="panel">

      <div class="section-title">

        <div>

          <h2>
            💳 اشتراک‌ها و پرداخت‌ها
          </h2>

          <p class="muted">
            هر پرداخت در یک کارت مستقل نمایش داده می‌شود.
          </p>

        </div>

        <span
          id="paymentCount"
          class="status"
        >
          0
        </span>

      </div>

      <div
        id="paymentsBody"
        class="cards"
      ></div>

    </div>


    <div class="panel">

      <div class="section-title">

        <div>

          <h2>
            🎫 پیام‌های کاربران
          </h2>

          <p class="muted">
            هر پیام یک گفت‌وگوی مستقل است و پاسخ شما مستقیماً در پنل همان کاربر نمایش داده می‌شود.
          </p>

        </div>

        <span
          id="supportCount"
          class="status"
        >
          0
        </span>

      </div>

      <div
        id="supportBody"
        class="cards"
      ></div>

    </div>

  </div>

</div>


<script>

let adminPassword = "";

let refreshTimer = null;

let lastSupportRows =
  new Set();


function login(){

  const password =
    document
      .getElementById(
        "password"
      )
      .value;

  const msg =
    document
      .getElementById(
        "loginMsg"
      );

  if(!password){

    msg.textContent =
      "رمز مدیریت را وارد کنید.";

    return;
  }

  adminPassword =
    password;

  google.script.run

    .withSuccessHandler(
      () => {

        msg.textContent =
          "ورود موفق بود.";

        document
          .getElementById(
            "dashboard"
          )
          .classList
          .remove(
            "hidden"
          );

        loadAll();

        startAutoRefresh();

      }
    )

    .withFailureHandler(
      error => {

        adminPassword =
          "";

        msg.textContent =
          error.message ||
          "رمز مدیریت اشتباه است.";

      }
    )

    .getPaymentsForAdmin(
      password
    );
}


function logout(){

  stopAutoRefresh();

  adminPassword =
    "";

  document
    .getElementById(
      "dashboard"
    )
    .classList
    .add(
      "hidden"
    );

  document
    .getElementById(
      "password"
    )
    .value =
    "";

  document
    .getElementById(
      "loginMsg"
    )
    .textContent =
    "";
}


function startAutoRefresh(){

  stopAutoRefresh();

  refreshTimer =
    setInterval(
      () => {

        if(adminPassword){

          loadAll(
            true
          );
        }

      },
      15000
    );
}


function stopAutoRefresh(){

  if(refreshTimer){

    clearInterval(
      refreshTimer
    );

    refreshTimer =
      null;
  }
}


function loadAll(
  background = false
){

  if(!adminPassword){
    return;
  }

  if(!background){

    document
      .getElementById(
        "refreshStatus"
      )
      .textContent =
      "در حال دریافت اطلاعات...";
  }

  loadPayments(
    background
  );

  loadSupport(
    background
  );
}


function loadPayments(
  background = false
){

  google.script.run

    .withSuccessHandler(
      rows => {

        renderPayments(
          rows
        );

        if(!background){

          document
            .getElementById(
              "refreshStatus"
            )
            .textContent =
            "اطلاعات اشتراک‌ها به‌روز شد.";
        }

      }
    )

    .withFailureHandler(
      error => {

        if(!background){

          document
            .getElementById(
              "refreshStatus"
            )
            .textContent =
            error.message ||
            "دریافت اشتراک‌ها ناموفق بود.";
        }

      }
    )

    .getPaymentsForAdmin(
      adminPassword
    );
}


function loadSupport(
  background = false
){

  google.script.run

    .withSuccessHandler(
      rows => {

        renderSupport(
          rows
        );

        if(!background){

          document
            .getElementById(
              "refreshStatus"
            )
            .textContent =
            "پیام‌ها به‌روز شدند.";
        }

      }
    )

    .withFailureHandler(
      error => {

        if(!background){

          document
            .getElementById(
              "refreshStatus"
            )
            .textContent =
            error.message ||
            "دریافت پیام‌ها ناموفق بود.";
        }

      }
    )

    .getSupportForAdmin(
      adminPassword
    );
}


function renderPayments(
  rows
){

  const body =
    document
      .getElementById(
        "paymentsBody"
      );

  document
    .getElementById(
      "paymentCount"
    )
    .textContent =
    String(
      rows.length || 0
    );

  if(
    !Array.isArray(rows) ||
    !rows.length
  ){

    body.innerHTML =
      '<div class="empty">هنوز پرداختی ثبت نشده است.</div>';

    return;
  }

  body.innerHTML =
    rows
      .map(
        row => {

          const cls =
            row.status ===
            'تأیید شد'

              ? 'approved'

              : row.status ===
                'رد شد'

                ? 'rejected'

                : 'pending';

          return `

            <article
              class="item-card"
            >

              <div
                class="item-head"
              >

                <div>

                  <span
                    class="muted"
                  >
                    کاربر
                  </span>

                  <h3>
                    ${escapeHtml(
                      row.username
                    )}
                  </h3>

                </div>

                <span
                  class="status ${cls}"
                >
                  ${escapeHtml(
                    row.status ||
                    "-"
                  )}
                </span>

              </div>


              <div
                class="meta"
              >

                <span>
                  🕒
                  ${formatDate(
                    row.timestamp
                  )}
                </span>

                <span>
                  📱
                  ${escapeHtml(
                    row.phone ||
                    "-"
                  )}
                </span>

                <span>
                  👑
                  ${escapeHtml(
                    row.planName ||
                    row.planId ||
                    "-"
                  )}
                </span>

                <span>
                  💰
                  ${Number(
                    row.amount ||
                    0
                  ).toLocaleString(
                    'fa-IR'
                  )}
                  تومان
                </span>

                ${
                  row.subscriptionExpiry

                    ? `

                      <span>
                        📅
                        پایان اشتراک:
                        ${formatDate(
                          row.subscriptionExpiry
                        )}
                      </span>

                    `

                    : ""
                }

              </div>


              ${
                row.receiptUrl

                  ? `

                    <a
                      class="receipt"
                      href="${escapeAttribute(
                        row.receiptUrl
                      )}"
                      target="_blank"
                    >
                      مشاهده فیش
                    </a>

                    `

                  : ""
              }


              ${
                row.userMessage

                  ? `

                    <div
                      class="message-box"
                    >
                      ${escapeHtml(
                        row.userMessage
                      )}
                    </div>

                    `

                  : ""
              }


              <div
                class="actions"
              >

                <button
                  class="primary"
                  onclick="setPaymentStatus(
                    ${row.rowNumber},
                    'تأیید شد'
                  )"
                >
                  تأیید و فعال‌سازی
                </button>

                <button
                  class="danger"
                  onclick="setPaymentStatus(
                    ${row.rowNumber},
                    'رد شد'
                  )"
                >
                  رد
                </button>

                <button
                  class="secondary"
                  onclick="setPaymentStatus(
                    ${row.rowNumber},
                    'در انتظار بررسی'
                  )"
                >
                  در انتظار
                </button>

              </div>

            </article>

          `;
        }
      )
      .join(
        ''
      );
}


function renderSupport(
  rows
){

  const body =
    document
      .getElementById(
        "supportBody"
      );

  document
    .getElementById(
      "supportCount"
    )
    .textContent =
    String(
      rows.length || 0
    );

  if(
    !Array.isArray(rows) ||
    !rows.length
  ){

    body.innerHTML =
      '<div class="empty">هنوز پیامی ثبت نشده است.</div>';

    return;
  }

  body.innerHTML =
    rows
      .map(
        row => {

          const replied =
            Boolean(
              row.adminReply
            );

          const isNew =
            !lastSupportRows.has(
              row.rowNumber
            );

          return `

            <article
              class="item-card ${
                isNew
                  ? "new"
                  : ""
              }"
            >

              <div
                class="item-head"
              >

                <div>

                  <span
                    class="muted"
                  >
                    ${escapeHtml(
                      row.username
                    )}
                  </span>

                  <h3>
                    ${escapeHtml(
                      row.subject ||
                      'بدون موضوع'
                    )}
                  </h3>

                </div>

                <span
                  class="status ${
                    replied
                      ? 'replied'
                      : ''
                  }"
                >
                  ${escapeHtml(
                    row.status ||
                    'جدید'
                  )}
                </span>

              </div>


              <div
                class="meta"
              >

                <span>
                  🕒
                  ${formatDate(
                    row.timestamp
                  )}
                </span>

                <span>
                  📱
                  ${escapeHtml(
                    row.phone ||
                    '-'
                  )}
                </span>

              </div>


              <div
                class="message-box"
              >

                <strong>
                  پیام کاربر:
                </strong>

                <br>

                ${escapeHtml(
                  row.message ||
                  ''
                )}

              </div>


              ${
                replied

                  ? `

                    <div
                      class="message-box"
                    >

                      <strong>
                        پاسخ فعلی شما:
                      </strong>

                      <br>

                      ${escapeHtml(
                        row.adminReply
                      )}

                      <div
                        class="reply-meta"
                      >
                        ${formatDate(
                          row.replyTimestamp
                        )}
                      </div>

                    </div>

                    `

                  : ""
              }


              <div
                class="reply-box"
              >

                <textarea
                  id="reply-${row.rowNumber}"
                  placeholder="پاسخ را برای کاربر بنویسید..."
                >${escapeHtml(
                  row.adminReply ||
                  ''
                )}</textarea>


                <div
                  class="actions"
                >

                  <button
                    class="primary"
                    onclick="replySupport(
                      ${row.rowNumber}
                    )"
                  >
                    ارسال پیام
                  </button>

                  <button
                    class="secondary"
                    onclick="setSupportStatus(
                      ${row.rowNumber},
                      'در حال بررسی'
                    )"
                  >
                    در حال بررسی
                  </button>

                  <button
                    class="danger"
                    onclick="setSupportStatus(
                      ${row.rowNumber},
                      'بسته شد'
                    )"
                  >
                    بستن
                  </button>

                </div>

              </div>

            </article>

          `;
        }
      )
      .join(
        ''
      );

  lastSupportRows =
    new Set(
      rows.map(
        row =>
          row.rowNumber
      )
    );
}


function setPaymentStatus(
  rowNumber,
  status
){

  google.script.run

    .withSuccessHandler(
      result => {

        alert(
          result &&
          result.message
            ? result.message
            : "وضعیت پرداخت به‌روز شد."
        );

        loadPayments();
      }
    )

    .withFailureHandler(
      error => {

        alert(
          error.message ||
          "خطا"
        );
      }
    )

    .updatePaymentStatus(
      adminPassword,
      rowNumber,
      status
    );
}


function replySupport(
  rowNumber
){

  const textarea =
    document
      .getElementById(
        `reply-${rowNumber}`
      );

  if(!textarea){
    return;
  }

  const reply =
    textarea.value.trim();

  if(!reply){

    alert(
      "متن پاسخ را وارد کنید."
    );

    return;
  }

  textarea.disabled =
    true;

  google.script.run

    .withSuccessHandler(
      result => {

        alert(
          result &&
          result.message
            ? result.message
            : "پاسخ ارسال شد."
        );

        loadSupport();
      }
    )

    .withFailureHandler(
      error => {

        textarea.disabled =
          false;

        alert(
          error.message ||
          "ارسال پاسخ ناموفق بود."
        );
      }
    )

    .replyToSupport(
      adminPassword,
      rowNumber,
      reply,
      "پاسخ داده شد"
    );
}


function setSupportStatus(
  rowNumber,
  status
){

  google.script.run

    .withSuccessHandler(
      () =>
        loadSupport()
    )

    .withFailureHandler(
      error =>
        alert(
          error.message ||
          "خطا"
        )
    )

    .updateSupportStatus(
      adminPassword,
      rowNumber,
      status
    );
}


function toggleTheme(){

  document
    .body
    .classList
    .toggle(
      "dark"
    );
}


function formatDate(
  value
){

  if(!value){
    return "-";
  }

  try{

    return new Date(
      value
    ).toLocaleString(
      "fa-IR"
    );

  }catch{

    return String(
      value
    );
  }
}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );
}

</script>

</body>

</html>
