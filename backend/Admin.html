
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>QuizDuo Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

body.dark {
    background: #111827;
    color: #f3f4f6;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    font-family: inherit;
}

.primary {
    background: #167c80;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #dc3545;
    color: white;
}

.success {
    background: #198754;
    color: white;
}

.warning {
    background: #f59e0b;
    color: white;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 11px;
    font-family: inherit;
    background: white;
    color: #111827;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

body.dark input,
body.dark textarea,
body.dark select {
    background: #1f2937;
    color: white;
    border-color: #374151;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 5px 25px rgba(0,0,0,.06);
}

body.dark .panel {
    background: #1f2937;
}

.hidden {
    display: none !important;
}

.login {
    max-width: 420px;
    margin: 100px auto;
}

.login h1 {
    margin-bottom: 20px;
}

.login button {
    width: 100%;
    margin-top: 12px;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: right;
    vertical-align: top;
}

body.dark th,
body.dark td {
    border-color: #374151;
}

.table-wrap {
    overflow-x: auto;
}

.status {
    font-weight: bold;
}

.status.pending {
    color: #d97706;
}

.status.approved {
    color: #198754;
}

.status.rejected {
    color: #dc3545;
}

.actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.receipt {
    display: inline-block;
    margin-top: 6px;
}

.support-ticket {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

body.dark .support-ticket {
    border-color: #374151;
}

.support-ticket h3 {
    margin-top: 0;
}

.reply-box {
    margin-top: 15px;
}

.reply-box textarea {
    margin-bottom: 8px;
}

.top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.loading {
    text-align: center;
    padding: 30px;
}

</style>

</head>


<body>

<div id="loginPage" class="container">

    <div class="panel login">

        <h1>🔐 QuizDuo Admin</h1>

        <p>
            برای ورود رمز مدیریت را وارد کنید.
        </p>

        <input
            id="password"
            type="password"
            placeholder="رمز مدیریت">

        <button
            id="loginBtn"
            class="primary">
            ورود
        </button>

        <p
            id="loginMessage"
            class="message">
        </p>

    </div>

</div>


<div id="adminPage"
     class="container hidden">

    <header>

        <div>
            <h1>QuizDuo Admin</h1>
            <p>
                مدیریت پرداخت‌ها و پشتیبانی
            </p>
        </div>

        <div class="top-actions">

            <button
                id="refreshBtn"
                class="primary">
                🔄 بروزرسانی
            </button>

            <button
                id="themeBtn"
                class="secondary">
                🌙 حالت
            </button>

            <button
                id="logoutBtn"
                class="danger">
                خروج
            </button>

        </div>

    </header>


    <!-- PAYMENTS -->

    <section class="panel">

        <h2>
            💳 درخواست‌های اشتراک
        </h2>

        <div
            id="paymentsLoading"
            class="loading">
            در حال بارگذاری...
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                <tr>

                    <th>
                        کاربر
                    </th>

                    <th>
                        پلن
                    </th>

                    <th>
                        مبلغ
                    </th>

                    <th>
                        فیش
                    </th>

                    <th>
                        وضعیت
                    </th>

                    <th>
                        عملیات
                    </th>

                </tr>

                </thead>

                <tbody id="paymentsBody">
                </tbody>

            </table>

        </div>

    </section>


    <!-- SUPPORT -->

    <section class="panel">

        <h2>
            🎫 درخواست‌های پشتیبانی
        </h2>

        <div
            id="supportLoading"
            class="loading">
            در حال بارگذاری...
        </div>

        <div id="supportList">
        </div>

    </section>

</div>


<script>

let adminPassword = "";


const $ = id =>
    document.getElementById(id);


// ============================================================
// LOGIN
// ============================================================

$("loginBtn").addEventListener(
    "click",
    login
);


$("password").addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            login();
        }

    }
);


function login() {

    const password =
        $("password").value;

    if (!password) {

        $("loginMessage").textContent =
            "رمز مدیریت را وارد کنید.";

        return;
    }


    $("loginMessage").textContent =
        "در حال بررسی...";


    google.script.run
        .withSuccessHandler(
            result => {

                if (!result) {

                    $("loginMessage").textContent =
                        "رمز مدیریت اشتباه است.";

                    return;
                }


                adminPassword =
                    password;

                $("loginPage")
                    .classList.add("hidden");

                $("adminPage")
                    .classList.remove("hidden");

                loadAll();
            }
        )
        .withFailureHandler(
            error => {

                $("loginMessage").textContent =
                    error.message ||
                    "خطا در ورود.";
            }
        )
        .checkAdmin(password);
}


// ============================================================
// LOAD
// ============================================================

function loadAll() {

    loadPayments();
    loadSupport();
}


$("refreshBtn").addEventListener(
    "click",
    loadAll
);


// ============================================================
// PAYMENTS
// ============================================================

function loadPayments() {

    $("paymentsLoading")
        .classList.remove("hidden");


    google.script.run
        .withSuccessHandler(
            rows => {

                $("paymentsLoading")
                    .classList.add("hidden");

                renderPayments(rows || []);
            }
        )
        .withFailureHandler(
            error => {

                $("paymentsLoading")
                    .classList.add("hidden");

                alert(
                    error.message ||
                    "خطا در دریافت پرداخت‌ها."
                );
            }
        )
        .getPaymentsForAdmin(
            adminPassword
        );
}


function renderPayments(rows) {

    const body =
        $("paymentsBody");

    body.innerHTML = "";


    if (!rows.length) {

        body.innerHTML =
            `<tr>
                <td colspan="6">
                    هنوز درخواست پرداختی ثبت نشده است.
                </td>
            </tr>`;

        return;
    }


    rows
        .slice()
        .reverse()
        .forEach(row => {

            const tr =
                document.createElement("tr");


            const statusClass =
                row.status === "تأیید شد"
                    ? "approved"
                    : row.status === "رد شد"
                        ? "rejected"
                        : "pending";


            tr.innerHTML =
                `<td>
                    <strong>
                        ${escapeHtml(row.username)}
                    </strong>
                    <br>
                    <small>
                        ${escapeHtml(row.phone || "-")}
                    </small>
                </td>

                <td>
                    ${escapeHtml(row.planName)}
                </td>

                <td>
                    ${Number(row.amount || 0)
                        .toLocaleString("fa-IR")}
                    تومان
                </td>

                <td>
                    ${
                        row.receiptUrl
                            ? `<a
                                class="receipt"
                                href="${row.receiptUrl}"
                                target="_blank">
                                مشاهده فیش
                               </a>`
                            : "-"
                    }
                </td>

                <td>
                    <span
                        class="status ${statusClass}">
                        ${escapeHtml(row.status)}
                    </span>

                    ${
                        row.adminMessage
                            ? `<br>
                               <small>
                                 ${escapeHtml(
                                     row.adminMessage
                                 )}
                               </small>`
                            : ""
                    }
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="success"
                            onclick="changePayment(
                                ${row.rowNumber},
                                'تأیید شد'
                            )">
                            ✓ تأیید
                        </button>

                        <button
                            class="danger"
                            onclick="changePayment(
                                ${row.rowNumber},
                                'رد شد'
                            )">
                            ✕ رد
                        </button>

                        <button
                            class="warning"
                            onclick="changePayment(
                                ${row.rowNumber},
                                'در انتظار بررسی'
                            )">
                            در انتظار
                        </button>

                    </div>

                </td>`;


            body.appendChild(tr);
        });
}


// ============================================================
// CHANGE PAYMENT
// ============================================================

function changePayment(
    rowNumber,
    status
) {

    const question =
        status === "تأیید شد"
            ? "آیا پرداخت تأیید شود؟"
            : status === "رد شد"
                ? "آیا پرداخت رد شود؟"
                : "وضعیت به انتظار بررسی تغییر کند؟";


    if (!confirm(question)) {
        return;
    }


    google.script.run
        .withSuccessHandler(
            result => {

                alert(
                    result.message ||
                    "وضعیت تغییر کرد."
                );

                loadPayments();
            }
        )
        .withFailureHandler(
            error => {

                alert(
                    error.message ||
                    "تغییر وضعیت انجام نشد."
                );
            }
        )
        .updatePaymentStatus(
            adminPassword,
            rowNumber,
            status
        );
}


// ============================================================
// SUPPORT
// ============================================================

function loadSupport() {

    $("supportLoading")
        .classList.remove("hidden");


    google.script.run
        .withSuccessHandler(
            rows => {

                $("supportLoading")
                    .classList.add("hidden");

                renderSupport(rows || []);
            }
        )
        .withFailureHandler(
            error => {

                $("supportLoading")
                    .classList.add("hidden");

                alert(
                    error.message ||
                    "خطا در دریافت پشتیبانی."
                );
            }
        )
        .getSupportForAdmin(
            adminPassword
        );
}


function renderSupport(rows) {

    const box =
        $("supportList");

    box.innerHTML = "";


    if (!rows.length) {

        box.innerHTML =
            `<p>
                هنوز درخواست پشتیبانی وجود ندارد.
             </p>`;

        return;
    }


    rows
        .slice()
        .reverse()
        .forEach(row => {

            const article =
                document.createElement(
                    "article"
                );

            article.className =
                "support-ticket";


            article.innerHTML =
                `<h3>
                    ${escapeHtml(
                        row.subject
                    )}
                </h3>

                <p>
                    <strong>
                        کاربر:
                    </strong>
                    ${escapeHtml(
                        row.username
                    )}
                </p>

                <p>
                    <strong>
                        شماره:
                    </strong>
                    ${escapeHtml(
                        row.phone || "-"
                    )}
                </p>

                <p>
                    ${escapeHtml(
                        row.text
                    )}
                </p>

                <p>
                    <strong>
                        وضعیت:
                    </strong>
                    ${escapeHtml(
                        row.status
                    )}
                </p>

                ${
                    row.reply
                        ? `<div class="panel">
                            <strong>
                                پاسخ فعلی:
                            </strong>
                            <p>
                                ${escapeHtml(
                                    row.reply
                                )}
                            </p>
                           </div>`
                        : ""
                }

                <div class="reply-box">

                    <textarea
                        id="reply-${row.rowNumber}"
                        placeholder="پاسخ خود را بنویسید...">${escapeHtml(
                            row.reply || ""
                        )}</textarea>

                    <div class="actions">

                        <button
                            class="primary"
                            onclick="sendReply(
                                ${row.rowNumber}
                            )">
                            📩 ارسال پاسخ
                        </button>

                        <button
                            class="warning"
                            onclick="changeSupportStatus(
                                ${row.rowNumber},
                                'در حال بررسی'
                            )">
                            در حال بررسی
                        </button>

                        <button
                            class="success"
                            onclick="changeSupportStatus(
                                ${row.rowNumber},
                                'پاسخ داده شد'
                            )">
                            پاسخ داده شد
                        </button>

                        <button
                            class="secondary"
                            onclick="changeSupportStatus(
                                ${row.rowNumber},
                                'بسته شد'
                            )">
                            بستن
                        </button>

                    </div>

                </div>`;


            box.appendChild(article);
        });
}


// ============================================================
// SEND SUPPORT REPLY
// ============================================================

function sendReply(rowNumber) {

    const textarea =
        $("reply-" + rowNumber);

    const text =
        textarea.value.trim();


    if (!text) {

        alert(
            "متن پاسخ را وارد کنید."
        );

        return;
    }


    google.script.run
        .withSuccessHandler(
            result => {

                alert(
                    result.message ||
                    "پاسخ ثبت شد."
                );

                loadSupport();
            }
        )
        .withFailureHandler(
            error => {

                alert(
                    error.message ||
                    "ارسال پاسخ انجام نشد."
                );
            }
        )
        .replyToSupport(
            adminPassword,
            rowNumber,
            text
        );
}


// ============================================================
// SUPPORT STATUS
// ============================================================

function changeSupportStatus(
    rowNumber,
    status
) {

    google.script.run
        .withSuccessHandler(
            () => loadSupport()
        )
        .withFailureHandler(
            error => {

                alert(
                    error.message ||
                    "تغییر وضعیت انجام نشد."
                );
            }
        )
        .updateSupportStatus(
            adminPassword,
            rowNumber,
            status
        );
}


// ============================================================
// THEME
// ============================================================

$("themeBtn").addEventListener(
    "click",
    () => {

        document.body.classList.toggle(
            "dark"
        );

        localStorage.setItem(
            "quizduo_admin_theme",
            document.body.classList.contains(
                "dark"
            )
                ? "dark"
                : "light"
        );
    }
);


if (
    localStorage.getItem(
        "quizduo_admin_theme"
    ) === "dark"
) {
    document.body.classList.add(
        "dark"
    );
}


// ============================================================
// LOGOUT
// ============================================================

$("logoutBtn").addEventListener(
    "click",
    () => {

        adminPassword = "";

        $("adminPage")
            .classList.add("hidden");

        $("loginPage")
            .classList.remove("hidden");

        $("password").value = "";
    }
);


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
