<!doctype html>

<html
    lang="fa"
    dir="rtl"
>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        QuizDuo Admin
    </title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f5f7fb;
            color:#172033;
            margin:0;
            padding:24px
        }

        .wrap{
            max-width:1100px;
            margin:auto
        }

        .card{
            background:#fff;
            border:1px solid #dfe5ef;
            border-radius:18px;
            padding:22px;
            margin-bottom:18px;
            box-shadow:0 10px 30px #18243a12
        }

        input,
        button{
            font:inherit
        }

        input{
            padding:12px;
            border:1px solid #ccd5e3;
            border-radius:10px;
            width:100%;
            box-sizing:border-box;
            margin:8px 0 12px
        }

        button{
            border:0;
            border-radius:10px;
            padding:11px 16px;
            cursor:pointer;
            font-weight:700
        }

        .primary{
            background:#20a99d;
            color:#fff
        }

        .approve{
            background:#168a5b;
            color:#fff
        }

        .reject{
            background:#d94a5b;
            color:#fff
        }

        .muted{
            color:#69758a
        }

        .hidden{
            display:none
        }

        .req{
            border:1px solid #e1e6ef;
            border-radius:16px;
            padding:18px;
            margin:12px 0;
            background:#fff
        }

        .actions{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-top:14px
        }

        .status{
            display:inline-block;
            padding:5px 9px;
            border-radius:999px;
            font-size:12px;
            font-weight:700;
            margin-right:7px
        }

        .pending{
            background:#fff3cd;
            color:#8a6500
        }

        .approved{
            background:#d9f7e8;
            color:#087443
        }

        .rejected{
            background:#fde0e5;
            color:#a1263a
        }

        .info-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
            margin-top:12px
        }

        .info-item{
            padding:10px 12px;
            border-radius:10px;
            background:#f5f7fb
        }

        .info-item span{
            display:block;
            color:#69758a;
            font-size:12px;
            margin-bottom:3px
        }

        a{
            color:#5267d8
        }

        @media(max-width:650px){

            body{
                padding:12px
            }

            .info-grid{
                grid-template-columns:1fr
            }

        }

    </style>

</head>


<body>

<div class="wrap">


    <div
        id="login"
        class="card"
    >

        <h1>
            پنل مدیر QuizDuo
        </h1>

        <p class="muted">
            برای بررسی و تأیید پرداخت‌ها وارد شوید.
        </p>

        <input
            id="password"
            type="password"
            placeholder="رمز مدیر"
        >

        <button
            class="primary"
            onclick="login()"
        >
            ورود
        </button>

        <p id="loginMsg"></p>

    </div>


    <div
        id="panel"
        class="hidden"
    >

        <div class="card">

            <h1>
                درخواست‌های اشتراک
            </h1>

            <p class="muted">
                فیش را بررسی کن و سپس درخواست را تأیید یا رد کن.
            </p>

            <button
                class="primary"
                onclick="loadRequests()"
            >
                به‌روزرسانی
            </button>

        </div>


        <div id="requests"></div>

    </div>

</div>


<script>

let token = '';


function login(){

    const password =
        document
            .getElementById(
                'password'
            )
            .value;


    google.script.run

        .withSuccessHandler(
            receivedToken => {

                token =
                    receivedToken;

                document
                    .getElementById(
                        'login'
                    )
                    .classList
                    .add('hidden');

                document
                    .getElementById(
                        'panel'
                    )
                    .classList
                    .remove('hidden');

                loadRequests();
            }
        )

        .withFailureHandler(
            error => {

                document
                    .getElementById(
                        'loginMsg'
                    )
                    .textContent =
                    error.message;
            }
        )

        .adminLogin(
            password
        );
}


function loadRequests(){

    google.script.run

        .withSuccessHandler(
            render
        )

        .withFailureHandler(
            error =>
                alert(
                    error.message
                )
        )

        .adminList(
            token
        );
}


function render(items){

    const box =
        document.getElementById(
            'requests'
        );


    if (
        !items.length
    ) {

        box.innerHTML =
            '<div class="card">' +
            'درخواستی ثبت نشده است.' +
            '</div>';

        return;
    }


    box.innerHTML =

        items

            .map(item => `

                <div class="req">

                    <div>

                        <b>
                            ${esc(
                                item.requestId
                            )}
                        </b>

                        <span
                            class="status ${esc(
                                item.status
                            )}"
                        >
                            ${statusText(
                                item.status
                            )}
                        </span>

                    </div>


                    <div class="info-grid">

                        <div class="info-item">

                            <span>
                                نام کاربری
                            </span>

                            <b>
                                ${esc(
                                    item.username
                                )}
                            </b>

                        </div>


                        <div class="info-item">

                            <span>
                                شماره تلفن
                            </span>

                            <b dir="ltr">
                                ${esc(
                                    item.phone
                                )}
                            </b>

                        </div>


                        <div class="info-item">

                            <span>
                                اشتراک
                            </span>

                            <b>
                                ${esc(
                                    item.planName
                                )}
                            </b>

                        </div>


                        <div class="info-item">

                            <span>
                                مبلغ
                            </span>

                            <b>
                                ${Number(
                                    item.amount
                                ).toLocaleString(
                                    'fa-IR'
                                )}
                                تومان
                            </b>

                        </div>

                    </div>


                    <p>

                        <b>
                            زمان:
                        </b>

                        ${new Date(
                            item.createdAt
                        ).toLocaleString(
                            'fa-IR'
                        )}

                    </p>


                    <p>

                        <a
                            href="${esc(
                                item.receiptUrl
                            )}"
                            target="_blank"
                            rel="noopener"
                        >
                            📎 مشاهده فیش
                        </a>

                    </p>


                    ${
                        item.status ===
                        'pending'

                        ? `

                            <div class="actions">

                                <button
                                    class="approve"
                                    onclick="
                                        setStatus(
                                            '${esc(
                                                item.requestId
                                            )}',
                                            'approved'
                                        )
                                    "
                                >
                                    ✓ تأیید پرداخت
                                </button>


                                <button
                                    class="reject"
                                    onclick="
                                        setStatus(
                                            '${esc(
                                                item.requestId
                                            )}',
                                            'rejected'
                                        )
                                    "
                                >
                                    ✕ رد پرداخت
                                </button>

                            </div>

                        `

                        : ''

                    }

                </div>

            `)

            .join('');
}


function setStatus(
    requestId,
    status
){

    const message =
        status === 'approved'
            ? 'آیا از تأیید این پرداخت مطمئن هستید؟'
            : 'آیا می‌خواهید این پرداخت را رد کنید؟';


    if (
        !confirm(
            message
        )
    ) {
        return;
    }


    google.script.run

        .withSuccessHandler(
            loadRequests
        )

        .withFailureHandler(
            error =>
                alert(
                    error.message
                )
        )

        .adminSetStatus(
            token,
            requestId,
            status
        );
}


function statusText(
    status
){

    if (
        status === 'approved'
    ) {

        return 'تأیید شده';
    }


    if (
        status === 'rejected'
    ) {

        return 'رد شده';
    }


    return 'در انتظار بررسی';
}


function esc(
    value
){

    return String(
        value
    )

        .replace(
            /[&<>'"]/g,
            character =>
                ({

                    '&':
                        '&amp;',

                    '<':
                        '&lt;',

                    '>':
                        '&gt;',

                    "'":
                        '&#39;',

                    '"':
                        '&quot;'

                }[character])
        );
}

</script>

</body>

</html>
