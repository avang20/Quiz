<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuizDuo Admin</title>
  <style>
    :root {
      font-family: Tahoma, Arial, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #f8fafc, #eef2ff); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1180px, calc(100% - 24px)); margin: 24px auto 48px; }
    .topbar, .panel { background: rgba(255,255,255,.94); border: 1px solid rgba(15,23,42,.08); box-shadow: 0 18px 45px rgba(15,23,42,.08); border-radius: 22px; }
    .topbar { padding: 20px; display: grid; gap: 14px; }
    h1,h2,h3,p { margin-top: 0; }
    .muted { color: #667085; }
    .login-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    input, textarea, select { width: 100%; border: 1px solid #d7dce5; border-radius: 14px; padding: 12px 14px; outline: none; background: #fff; }
    input:focus, textarea:focus, select:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.11); }
    textarea { min-height: 160px; resize: vertical; line-height: 1.9; }
    .btn { border: 0; border-radius: 14px; padding: 11px 16px; font-weight: 800; }
    .btn-primary { background: #6d28d9; color: #fff; }
    .btn-secondary { background: #eef2ff; color: #312e81; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .tabs { display: flex; gap: 10px; margin: 18px 0; }
    .tabs button.active { background: #111827; color: #fff; }
    .view { display: none; }
    .view.active { display: block; }
    .grid { display: grid; gap: 16px; }
    .payment-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .panel { padding: 18px; }
    .card-title { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .badge { display: inline-flex; padding: 6px 10px; border-radius: 999px; font-size: .78rem; font-weight: 900; white-space: nowrap; }
    .badge.wait { background: #fff7ed; color: #9a3412; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.no { background: #fee2e2; color: #991b1b; }
    .badge.info { background: #dbeafe; color: #1d4ed8; }
    .meta { display: grid; gap: 7px; color: #475467; font-size: .92rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .support-thread { display: grid; gap: 10px; margin: 16px 0; max-height: 560px; overflow-y: auto; padding: 2px; }
    .message { border-radius: 16px; padding: 12px 14px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { background: #eff6ff; border: 1px solid #dbeafe; }
    .message.admin { background: #ecfdf5; border: 1px solid #d1fae5; }
    .message-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
    .message small { display: block; margin-top: 6px; color: #667085; font-weight: 500; }
    .reply-box { display: grid; gap: 10px; margin-top: 16px; }
    .empty, .error { padding: 26px; text-align: center; color: #667085; }
    .hidden { display: none !important; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .count { font-weight: 900; }
    @media (max-width: 640px) {
      .wrap { width: min(100% - 12px, 1180px); margin-top: 8px; }
      .topbar, .panel { border-radius: 16px; padding: 14px; }
      .login-row { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      .tabs button { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div>
        <h1>QuizDuo Admin</h1>
        <p class="muted">مدیریت پرداخت‌ها و گفت‌وگوهای پشتیبانی</p>
      </div>
      <div class="login-row">
        <input id="password" type="password" placeholder="رمز مدیریت">
        <button class="btn btn-primary" onclick="login()">ورود</button>
      </div>
      <p id="loginMessage" class="muted"></p>
    </section>

    <div id="adminArea" class="hidden">
      <div class="tabs">
        <button id="tabPayments" class="btn btn-secondary active" onclick="showTab('payments')">💳 پرداخت‌ها</button>
        <button id="tabSupport" class="btn btn-secondary" onclick="showTab('support')">🎫 پشتیبانی</button>
        <button class="btn btn-secondary" onclick="refreshAll()">🔄 بروزرسانی</button>
      </div>

      <section id="payments" class="view active">
        <div class="toolbar">
          <h2>پرداخت‌ها</h2>
          <span id="paymentCount" class="count"></span>
        </div>
        <div id="paymentsList" class="grid payment-grid"></div>
      </section>

      <section id="support" class="view">
        <div class="toolbar">
          <h2>گفت‌وگوهای پشتیبانی</h2>
          <span id="supportCount" class="count"></span>
        </div>
        <div id="supportList" class="grid"></div>
      </section>
    </div>
  </div>

<script>
  let adminPassword = '';

  function runServer(method, args = []) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[method](...args);
    });
  }

  function esc(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function formatDate(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    return date.toLocaleString('fa-IR');
  }

  function money(value) {
    return Number(value || 0).toLocaleString('fa-IR') + ' تومان';
  }

  function statusClass(status) {
    if (status === 'تأیید شد' || status === 'پاسخ داده شد') return 'ok';
    if (status === 'رد شد' || status === 'بسته شد') return 'no';
    if (status === 'در حال بررسی') return 'info';
    return 'wait';
  }

  async function login() {
    adminPassword = document.getElementById('password').value.trim();
    const msg = document.getElementById('loginMessage');
    if (!adminPassword) {
      msg.textContent = 'رمز مدیریت را وارد کنید.';
      return;
    }
    msg.textContent = 'در حال بررسی...';
    try {
      const payments = await runServer('getPaymentsForAdmin', [adminPassword]);
      adminPassword = adminPassword;
      document.getElementById('adminArea').classList.remove('hidden');
      msg.textContent = 'ورود موفق بود.';
      renderPayments(payments);
      await loadSupport();
    } catch (error) {
      msg.textContent = error && error.message ? error.message : 'ورود ناموفق بود.';
    }
  }

  function showTab(name) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
    if (name === 'payments') document.getElementById('tabPayments').classList.add('active');
    if (name === 'support') document.getElementById('tabSupport').classList.add('active');
  }

  async function refreshAll() {
    if (!adminPassword) return;
    try {
      const [payments] = await Promise.all([
        runServer('getPaymentsForAdmin', [adminPassword]),
        loadSupport()
      ]);
      renderPayments(payments);
    } catch (error) {
      alert(error && error.message ? error.message : 'بروزرسانی ناموفق بود.');
    }
  }

  function renderPayments(items) {
    const list = document.getElementById('paymentsList');
    document.getElementById('paymentCount').textContent = `${(items || []).length.toLocaleString('fa-IR')} مورد`;
    if (!items || !items.length) {
      list.innerHTML = '<div class="panel empty">هنوز پرداختی ثبت نشده است.</div>';
      return;
    }
    list.innerHTML = items.map(item => `
      <article class="panel">
        <div class="card-title">
          <div>
            <h3>${esc(item.username || '-')}</h3>
            <div class="muted">${esc(item.planName || item.planId || '-')}</div>
          </div>
          <span class="badge ${statusClass(item.status)}">${esc(item.status || '-')}</span>
        </div>
        <div class="meta">
          <div>📱 ${esc(item.phone || '-')}</div>
          <div>💰 ${money(item.amount)}</div>
          <div>🕒 ${esc(formatDate(item.timestamp))}</div>
          <div>🧾 ${esc(item.fileName || '-')}</div>
          ${item.receiptUrl ? `<div><a href="${esc(item.receiptUrl)}" target="_blank" rel="noopener">مشاهده فیش</a></div>` : ''}
          ${item.userMessage ? `<div>💬 ${esc(item.userMessage)}</div>` : ''}
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="setPaymentStatus(${Number(item.rowNumber)}, 'تأیید شد')">✅ تأیید</button>
          <button class="btn btn-danger" onclick="setPaymentStatus(${Number(item.rowNumber)}, 'رد شد')">❌ رد</button>
          <button class="btn btn-secondary" onclick="setPaymentStatus(${Number(item.rowNumber)}, 'در انتظار بررسی')">⏳ انتظار</button>
        </div>
      </article>
    `).join('');
  }

  async function setPaymentStatus(rowNumber, status) {
    if (!adminPassword) return;
    try {
      await runServer('updatePaymentStatus', [adminPassword, rowNumber, status]);
      await refreshAll();
    } catch (error) {
      alert(error && error.message ? error.message : 'تغییر وضعیت ناموفق بود.');
    }
  }

  async function loadSupport() {
    if (!adminPassword) return [];
    const items = await runServer('getSupportForAdmin', [adminPassword]);
    renderSupport(items);
    return items;
  }

  function renderSupport(items) {
    const list = document.getElementById('supportList');
    document.getElementById('supportCount').textContent = `${(items || []).length.toLocaleString('fa-IR')} گفت‌وگو`;
    if (!items || !items.length) {
      list.innerHTML = '<div class="panel empty">هنوز گفت‌وگوی پشتیبانی ثبت نشده است.</div>';
      return;
    }

    list.innerHTML = items.map(conversation => {
      const thread = Array.isArray(conversation.thread) ? conversation.thread : [];
      const messages = thread.map(item => `
        <div class="message ${item.sender === 'admin' ? 'admin' : 'user'}">
          <div class="message-head">
            <span>${item.sender === 'admin' ? 'پشتیبانی QuizDuo' : esc(conversation.username || 'کاربر')}</span>
            <span>${item.sender === 'admin' ? '🛠️' : '👤'}</span>
          </div>
          <div>${esc(item.text || '')}</div>
          <small>${esc(formatDate(item.timestamp))}</small>
        </div>
      `).join('');

      return `
        <article class="panel">
          <div class="card-title">
            <div>
              <h3>${esc(conversation.subject || 'بدون موضوع')}</h3>
              <div class="muted">${esc(conversation.username || '-')} · ${esc(conversation.phone || '-')}</div>
            </div>
            <span class="badge ${statusClass(conversation.status)}">${esc(conversation.status || 'جدید')}</span>
          </div>
          <div class="support-thread">${messages || '<div class="empty">پیامی در این گفت‌وگو وجود ندارد.</div>'}</div>
          <div class="reply-box">
            <textarea id="reply-${esc(conversation.conversationId)}" class="admin-support-reply" placeholder="پاسخ ادمین را کامل وارد کنید.."></textarea>
            <div class="actions">
              <select id="status-${esc(conversation.conversationId)}">
                <option value="پاسخ داده شد" ${conversation.status === 'پاسخ داده شد' ? 'selected' : ''}>پاسخ داده شد</option>
                <option value="در حال بررسی" ${conversation.status === 'در حال بررسی' ? 'selected' : ''}>در حال بررسی</option>
                <option value="جدید" ${conversation.status === 'جدید' ? 'selected' : ''}>جدید</option>
                <option value="بسته شد" ${conversation.status === 'بسته شد' ? 'selected' : ''}>بسته شد</option>
              </select>
              <button class="btn btn-primary" onclick="replySupport(${Number(conversation.lastRowNumber || conversation.rowNumber)}, '${esc(conversation.conversationId)}')">ارسال پاسخ در همین گفت‌وگو</button>
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  async function replySupport(rowNumber, conversationId) {
    if (!adminPassword) return;
    const textarea = document.getElementById(`reply-${conversationId}`);
    const status = document.getElementById(`status-${conversationId}`).value;
    const text = textarea ? textarea.value.trim() : '';
    if (!text) {
      alert('متن پاسخ را وارد کنید.');
      return;
    }
    try {
      await runServer('replyToSupport', [adminPassword, rowNumber, text, status]);
      await loadSupport();
    } catch (error) {
      alert(error && error.message ? error.message : 'ارسال پاسخ ناموفق بود.');
    }
  }
</script>
</body>
</html>
